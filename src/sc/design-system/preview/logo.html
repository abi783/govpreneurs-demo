<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockup" subtitle="Brand glyph + wordmark + DS version tag" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../type-and-components.css">
<style>
  body { padding: 24px; background: var(--bg-subtle); display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .logo-lg { height: 48px; width: auto; display: block; }
  .logo-md { height: 32px; width: auto; display: block; }
  .logo-sm { height: 22px; width: auto; display: block; }
  .meta { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); letter-spacing: 0; }
  .lockup-on-dark {
    padding: 14px 18px; border-radius: var(--r-md);
    background: var(--blue-12);
    display: flex; align-items: center; gap: 14px;
  }
  .tag { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); padding: 2px 7px; background: var(--n-3); border-radius: 4px; }
</style>
</head><body>

  <div class="row">
    <img class="logo-lg" src="../assets/govpreneurs-logo.svg" alt="GovPreneurs">
    <span class="tag">DS v4.1 · primary lockup</span>
  </div>

  <div class="row">
    <img class="logo-md" src="../assets/govpreneurs-logo.svg" alt="GovPreneurs">
    <span class="meta">32px · standard nav</span>
  </div>

  <div class="row">
    <img class="logo-sm" src="../assets/govpreneurs-logo.svg" alt="GovPreneurs">
    <span class="meta">22px · dense chrome</span>
  </div>

  <div class="lockup-on-dark">
    <img class="logo-md" src="../assets/govpreneurs-logo-white.svg" alt="GovPreneurs">
    <span class="meta" style="color: rgba(255,255,255,0.55);">white variant · for dark backgrounds (--blue-12, photography)</span>
  </div>

</body></html>
