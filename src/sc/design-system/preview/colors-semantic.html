<!doctype html>
<!-- @dsCard group="Colors" name="Semantic color roles" subtitle="6 swatches · the only colors in the system" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../type-and-components.css">
<style>body{padding:24px;background:var(--surface);display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.cell{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;}
.dot{width:34px;height:34px;border-radius:8px;flex-shrink:0;}
.meta .name{font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:-0.005em;}
.meta .role{font-size:11px;color:var(--text-3);margin-top:2px;}
</style>
</head><body>
<div class="cell"><div class="dot" style="background:var(--pos-7)"></div><div class="meta"><div class="name">Positive · sage</div><div class="role">Awarded, verified · never neon</div></div></div>
<div class="cell"><div class="dot" style="background:var(--warn-7)"></div><div class="meta"><div class="name">Warn · ochre</div><div class="role">Pending, medium-confidence</div></div></div>
<div class="cell"><div class="dot" style="background:var(--blue-7)"></div><div class="meta"><div class="name">Accent · federal blue</div><div class="role">Primary interactive, links, focus</div></div></div>
<div class="cell"><div class="dot" style="background:var(--ai-7)"></div><div class="meta"><div class="name">AI · amber</div><div class="role">Agent-authored content only</div></div></div>
<div class="cell"><div class="dot" style="background:var(--urg-7)"></div><div class="meta"><div class="name">Urgency · red</div><div class="role">&lt;7d deadlines, destructive</div></div></div>
<div class="cell"><div class="dot" style="background:var(--brand-7)"></div><div class="meta"><div class="name">Brand · GovPreneurs red</div><div class="role">Brand moments only — max 1/viewport</div></div></div>
</body></html>
