<!doctype html>
<!-- @dsCard group="Colors" name="Warm neutrals scale" subtitle="~30° hue · app bg → hi-contrast text" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../type-and-components.css">
<style>body{padding:24px;background:var(--surface);}.row{display:flex;gap:0;align-items:stretch;}.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9.5px;}.lab{display:flex;justify-content:space-between;margin-bottom:8px;align-items:baseline;}.name{font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:-0.005em;}.role{font-size:11px;color:var(--text-3);}</style>
</head><body>
<div class="lab"><span class="name">Warm neutrals</span><span class="role">~30° hue · app bg → hi-contrast text</span></div>
<div class="row" style="border-radius:6px;overflow:hidden;border:1px solid var(--border);">
<div class="sw" style="background:var(--n-1);color:var(--n-9)">01</div>
<div class="sw" style="background:var(--n-2);color:var(--n-9)">02</div>
<div class="sw" style="background:var(--n-3);color:var(--n-9)">03</div>
<div class="sw" style="background:var(--n-4);color:var(--n-10)">04</div>
<div class="sw" style="background:var(--n-5);color:var(--n-10)">05</div>
<div class="sw" style="background:var(--n-6);color:var(--n-11)">06</div>
<div class="sw" style="background:var(--n-7);color:white">07</div>
<div class="sw" style="background:var(--n-8);color:white">08</div>
<div class="sw" style="background:var(--n-9);color:white">09</div>
<div class="sw" style="background:var(--n-10);color:white">10</div>
<div class="sw" style="background:var(--n-11);color:white">11</div>
<div class="sw" style="background:var(--n-12);color:white">12</div>
</div>
</body></html>
