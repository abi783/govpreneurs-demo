<!doctype html>

<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../type-and-components.css">
<style>body{padding:24px;background:var(--surface);display:flex;gap:18px;align-items:flex-start;}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue-7),var(--blue-10));color:white;display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:-0.02em;flex-shrink:0;}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
.name{font-weight:600;font-size:14px;color:var(--text);}
.role{font-size:12px;color:var(--text-3);}
.body{font-size:13.5px;line-height:1.55;color:var(--text);}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--pos-2);color:var(--pos-9);margin-top:8px;}
.verdict::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pos-7);}
</style>
</head><body>
<div class="av">MS</div>
<div>
  <div class="head"><span class="name">Maya Srinivasan</span><span class="role">GovCon mentor · 18yr fed IT</span></div>

  <span class="verdict">Recommendation · Pursue</span>
</div>
