<!doctype html>

<div class="row"><div class="lab">Badges</div>

<span class="badge badge-pos">Awarded</span>
<span class="badge badge-warn">Pending review</span>
<span class="badge badge-urgent">Closes 5d</span>
<span class="badge badge-brand">Pro</span>
</div>
<div class="row"><div class="lab">State pills</div>
