<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · –s-1 through –s-12" viewport="700x300" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../type-and-components.css">
<style>body{padding:24px;background:var(--surface);display:flex;flex-direction:column;gap:8px;}
.row{display:grid;grid-template-columns:60px 1fr 80px;gap:14px;align-items:center;}
.bar{height:14px;background:var(--blue-7);border-radius:2px;}
.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-3);}
.px{font-family:var(--font-mono);font-size:11px;color:var(--text-2);text-align:right;}
</style>
</head><body>
<div class="row"><div class="tk">--s-1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
<div class="row"><div class="tk">--s-2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
<div class="row"><div class="tk">--s-3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
<div class="row"><div class="tk">--s-4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
<div class="row"><div class="tk">--s-5</div><div class="bar" style="width:20px"></div><div class="px">20 px</div></div>
<div class="row"><div class="tk">--s-6</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
<div class="row"><div class="tk">--s-8</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
<div class="row"><div class="tk">--s-10</div><div class="bar" style="width:40px"></div><div class="px">40 px</div></div>
<div class="row"><div class="tk">--s-12</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
</body></html>
