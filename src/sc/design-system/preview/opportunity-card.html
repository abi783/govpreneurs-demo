<!doctype html>
<!-- @dsCard group="Components" name="Opportunity card" subtitle="Score · narrative · meta · brand stripe" viewport="700x190" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../type-and-components.css">
<style>body{padding:0;background:var(--bg);}
.stripe{height:3px;background:var(--brand-stripe);}
.opp{position:relative;background:var(--surface);border-radius:0;box-shadow:var(--sh-rest);padding:18px 22px;display:grid;grid-template-columns:74px 1fr;gap:20px;}
.score{border-left:1px solid var(--border);padding-left:14px;margin-left:-14px;display:flex;flex-direction:column;gap:4px;}
.score .n{font-family:var(--font-mono);font-size:30px;line-height:1;font-weight:400;letter-spacing:-0.04em;color:var(--text-ink);}
.score .n sup{font-size:13px;color:var(--text-3);vertical-align:11px;}
.score .l{font-size:10px;font-weight:600;letter-spacing:0.09em;color:var(--text-3);text-transform:uppercase;}
.kicker{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin-bottom:6px;}
.kicker .dept{color:var(--blue-10);font-weight:500;}
.title{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-0.012em;color:var(--text);margin-bottom:8px;}
.meta{display:flex;gap:18px;font-size:12.5px;color:var(--text-2);padding-top:6px;}
.meta .l{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-right:4px;}
.meta .v{color:var(--text);font-weight:500;}
.meta .v.num{font-family:var(--font-mono);font-weight:400;}
</style>
</head><body>
<div class="stripe"></div>
<div class="opp">
  <div class="score"><div class="n">94<sup>%</sup></div><div class="l">Match</div></div>
  <div>
    <div class="kicker"><span class="dept">Dept. of Homeland Security</span><span style="opacity:0.4">·</span><span class="mono" style="font-size:11px;">70RTAC26Q00000014</span></div>
    <div class="title">IT support services for DHS field offices — tier-2 helpdesk</div>
    <div class="meta">
      <span><span class="l">Closes</span><span class="v" style="color:var(--red-7)">5d</span></span>
      <span><span class="l">Value</span><span class="v num">$2.5M</span></span>
      <span><span class="l">PoP</span><span class="v">DC metro</span></span>
      <span class="badge badge-blue" style="margin-left:auto">Open for bids</span>
    </div>
  </div>
</div>
</body></html>
