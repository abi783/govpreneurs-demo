<!doctype html>

<div class="sw" style="background:var(--blue-7);color:white">07</div>
<div class="sw" style="background:var(--blue-8);color:white">08</div>
<div class="sw" style="background:var(--blue-9);color:white">09</div>
<div class="sw" style="background:var(--blue-10);color:white">10</div>
<div class="sw" style="background:var(--blue-11);color:white">11</div>
<div class="sw" style="background:var(--blue-12);color:white">12</div>
</div>
</body></html>
